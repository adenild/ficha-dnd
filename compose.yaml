name: ficha-dnd

services:
  app:
    build: .
    image: ficha-dnd
    init: true
    restart: unless-stopped
    ports:
      - "${FICHA_PORTA:-3000}:3000"
    environment:
      PUBLIC_PORT: ${FICHA_PORTA:-3000}
      MAPAS_PORTA: ${MAPAS_PORTA:-3001}
      MAPAS_URL: http://mapas:3001
    volumes:
      - dados:/data

  # editor e visualizador de mapas; usa as contas, mesas e fichas do app
  mapas:
    image: ficha-dnd
    init: true
    restart: unless-stopped
    command: ["node", "mapas/server.js"]
    ports:
      - "${MAPAS_PORTA:-3001}:3001"
    environment:
      FICHA_URL: http://app:3000
      FICHA_PORTA: ${FICHA_PORTA:-3000}
      MAPAS_DATA: /data/mapas.json
      PUBLIC_PORT: ${MAPAS_PORTA:-3001}
    volumes:
      - dados:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    depends_on:
      app:
        condition: service_healthy

  # servidor MCP para o Claude, por stdio; sobe o app e os mapas sozinho se estiverem parados
  mcp:
    image: ficha-dnd
    init: true
    profiles: ["mcp"]
    stdin_open: true
    command: ["node", "mcp.js"]
    environment:
      FICHA_URL: http://app:3000
      MAPAS_URL: http://mapas:3001
      FICHA_TOKEN: ${FICHA_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
      mapas:
        condition: service_healthy

volumes:
  dados:
